<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f6f2">
<title>行情分享卡片 · Top100</title>
<style>
:root{--bg:#f3f5f1;--surface:#fff;--ink:#202925;--muted:#69736d;--line:#e1e7e1;--green:#2e6b50;--green-pale:#eaf2ec;--red:#bc5148;--red-pale:#faeeeb;--gold:#b98a47;--shadow:0 12px 36px rgba(29,55,39,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans CJK SC","PingFang SC","Microsoft YaHei",sans-serif;font-size:14px;line-height:1.55}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{max-width:1220px;margin:auto;padding:0 28px 40px}.header{height:68px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.brand{font-weight:750;font-size:17px;letter-spacing:0}.brand span{display:block;color:var(--muted);font-weight:450;font-size:11px}.header a{color:var(--green);font-size:13px}.intro{padding:30px 0 22px}.eyebrow{font-size:11px;font-weight:700;color:var(--green);letter-spacing:.08em}.intro h1{font-size:28px;line-height:1.3;margin:7px 0 5px;letter-spacing:0}.intro p{color:var(--muted);margin:0;font-size:13px}.workspace{display:grid;grid-template-columns:280px minmax(0,1fr);gap:26px;align-items:start}.controls{background:var(--surface);border:1px solid var(--line);padding:18px;box-shadow:var(--shadow)}.controls h2{font-size:15px;margin:0 0 14px}.label{display:block;font-size:11px;font-weight:700;color:var(--muted);margin:14px 0 6px}.search input,.range-select{width:100%;height:42px;padding:0 11px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink);outline:none}.search input:focus,.range-select:focus{border-color:var(--green)}.results{max-height:330px;overflow:auto;margin-top:7px;border-top:1px solid var(--line)}.result{width:100%;min-height:48px;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:7px 8px;border:0;border-bottom:1px solid #edf0ec;background:#fff}.result:hover,.result.active{background:var(--green-pale)}.result strong{font-size:13px}.result small{display:block;color:var(--muted);font-size:11px}.result .cap{font-size:10px;color:var(--muted)}.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.tab{min-height:38px;padding:5px 3px;border:1px solid var(--line);background:#fff;border-radius:3px;color:var(--muted);font-size:11px}.tab.active{background:var(--green);border-color:var(--green);color:#fff}.note{margin-top:16px;padding-top:12px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}.preview{min-width:0}.preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.preview-head h2{font-size:15px;margin:0}.preview-head span{color:var(--muted);font-size:11px}.downloads{display:flex;gap:8px;align-items:center}.btn{height:38px;padding:0 13px;border:1px solid var(--green);border-radius:3px;background:#fff;color:var(--green);font-size:12px;font-weight:650}.btn.primary{background:var(--green);color:#fff}.btn:disabled{opacity:.45;cursor:wait}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-items:start}.card{min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;margin:0 1px 7px;font-size:11px;font-weight:700}.card-head span{color:var(--muted);font-weight:450;font-size:10px}.canvas-wrap{background:#e5e9e4;border:1px solid #dfe4df;overflow:hidden;box-shadow:var(--shadow)}canvas{display:block;width:100%;height:auto;aspect-ratio:4/5}.status{min-height:20px;margin-top:12px;color:var(--muted);font-size:12px}.status.error{color:#a43b32}.empty{padding:28px 16px;color:var(--muted);text-align:center;font-size:12px}
@media(max-width:900px){.app{padding:0 18px 28px}.workspace{grid-template-columns:245px minmax(0,1fr);gap:16px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.app{padding:0 14px 28px}.header{height:58px}.brand{font-size:15px}.intro{padding:22px 0 16px}.intro h1{font-size:24px}.workspace{display:flex;flex-direction:column;gap:18px}.controls{width:100%;padding:14px}.controls h2{margin-bottom:9px}.results{max-height:178px;display:grid;grid-template-columns:1fr 1fr}.result{gap:5px;padding:6px}.result .cap{display:none}.preview{width:100%}.preview-head{flex-wrap:wrap}.preview-head h2{width:100%}.downloads{width:100%}.downloads .btn{flex:1}.cards{grid-template-columns:1fr;gap:20px}.card{max-width:430px;width:100%;margin:auto}.card-head{font-size:12px}.status{font-size:11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header class="header"><div class="brand">行情分享卡片<span>选股票，生成可直接转发的图片</span></div><a href="/">返回行情首页</a></header>
<section class="intro"><div class="eyebrow">TOP100 · 分享图片制作</div><h1>把行情，做成一张好读的图片</h1><p>适合手机查看与微信转发。选择公司和周期后，图片自动生成，可逐张保存。</p></section>
<main class="workspace">
<aside class="controls"><h2>图片内容</h2><label class="label" for="search">搜索公司或代码</label><div class="search"><input id="search" placeholder="例如：Apple / AAPL" autocomplete="off"></div><div class="results" id="results"><div class="empty">正在载入公司列表…</div></div><label class="label" for="range">行情周期</label><select id="range" class="range-select"><option value="1mo">近1个月</option><option value="3mo">近3个月</option><option value="6mo">近6个月</option><option value="1y" selected>近1年</option><option value="5y">近5年</option><option value="max">全部数据</option></select><div class="note">图片数据来自项目行情接口。卡片展示数据日期；内容仅供参考，不构成投资建议。</div></aside>
<section class="preview"><div class="preview-head"><h2 id="selected-title">正在准备图片…</h2><div class="downloads"><button class="btn" id="download-all" disabled>下载全部图片</button></div></div><div class="cards"><article class="card"><div class="card-head">公司行情 <span>01 / SNAPSHOT</span></div><div class="canvas-wrap"><canvas id="card-summary" width="1080" height="1350" aria-label="公司行情分享图"></canvas></div><button class="btn primary download-one" data-canvas="card-summary" style="width:100%;margin-top:8px">下载这张图片</button></article><article class="card"><div class="card-head">区间走势 <span>02 / TREND</span></div><div class="canvas-wrap"><canvas id="card-trend" width="1080" height="1350" aria-label="区间走势分享图"></canvas></div><button class="btn primary download-one" data-canvas="card-trend" style="width:100%;margin-top:8px">下载这张图片</button></article><article class="card"><div class="card-head">市场排行 <span>03 / MARKET</span></div><div class="canvas-wrap"><canvas id="card-market" width="1080" height="1350" aria-label="市场排行分享图"></canvas></div><button class="btn primary download-one" data-canvas="card-market" style="width:100%;margin-top:8px">下载这张图片</button></article></div><div class="status" id="status" aria-live="polite">正在加载真实行情…</div></section>
</main></div>
<script>
(()=>{'use strict';
const $=s=>document.querySelector(s),results=$('#results'),status=$('#status'),periodNames={'1mo':'近1个月','3mo':'近3个月','6mo':'近6个月','1y':'近1年','5y':'近5年','max':'全部数据'};
let stocks=[],selected=null,bars=[],range=$('#range').value,marketRows=[],serial=0;
const colors={bg:'#F5F6F2',ink:'#202925',muted:'#67736B',green:'#2E6B50',greenSoft:'#E8F0E9',red:'#B84F46',redSoft:'#F8ECE9',line:'#E1E7E1',gold:'#AE8141',white:'#FFFFFF'};
function money(n){return n==null?'—':'$'+Number(n).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})}
function pct(n){return `${n>=0?'+':''}${Number(n).toFixed(2)}%`}
function cap(n){if(!n)return '—';return Number(n)>=1000?'$'+(n/1000).toFixed(2)+'T':'$'+Number(n).toFixed(0)+'B'}
async function json(url){const r=await fetch(url);if(!r.ok)throw new Error(`请求失败（${r.status}）`);return r.json()}
function rounded(ctx,x,y,w,h,r,fill,stroke){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function text(ctx,s,x,y,size=30,color=colors.ink,weight=400,align='left'){ctx.font=`${weight} ${size}px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif`;ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(String(s),x,y)}
function wrapText(ctx,value,x,y,maxWidth,lineHeight,maxLines=4,size=30,color=colors.ink,weight=400){ctx.font=`${weight} ${size}px "Noto Sans CJK SC", "PingFang SC", "Microsoft YaHei", sans-serif`;ctx.fillStyle=color;ctx.textAlign='left';let lines=[],line='';for(const ch of String(value)){const next=line+ch;if(line&&ctx.measureText(next).width>maxWidth){lines.push(line);line=ch}else line=next}if(line)lines.push(line);if(lines.length>maxLines){lines=lines.slice(0,maxLines);let last=lines[maxLines-1];while(last&&ctx.measureText(last+'…').width>maxWidth)last=last.slice(0,-1);lines[maxLines-1]=last+'…'}lines.forEach((v,i)=>text(ctx,v,x,y+i*lineHeight,size,color,weight));return lines.length}
function base(canvas,kicker,title,sub){const c=canvas.getContext('2d');c.clearRect(0,0,1080,1350);c.fillStyle=colors.bg;c.fillRect(0,0,1080,1350);c.fillStyle=colors.green;c.fillRect(0,0,1080,18);rounded(c,64,64,952,1222,12,colors.white);text(c,'TOP100  ·  美股行情卡',112,130,24,colors.green,700);text(c,kicker,968,130,19,colors.gold,650,'right');c.strokeStyle=colors.line;c.lineWidth=2;c.beginPath();c.moveTo(112,168);c.lineTo(968,168);c.stroke();wrapText(c,title,112,235,850,55,2,48,colors.ink,750);if(sub)wrapText(c,sub,112,302,850,36,2,24,colors.muted,400);c.strokeStyle=colors.line;c.beginPath();c.moveTo(112,1198);c.lineTo(968,1198);c.stroke();text(c,'行情数据仅供参考，不构成投资建议',112,1247,21,colors.muted,400);text(c,'MARKET NOTES',968,1247,18,colors.muted,650,'right');return c}
function renderSummary(){if(!selected||!bars.length)return;const c=base($('#card-summary'),'公司快照',selected.name,`${selected.symbol}  ·  ${selected.sector||'美国上市公司'}`);const last=bars.at(-1),first=bars[0],change=first[2]?(last[2]-first[2])/first[2]*100:0,positive=change>=0,accent=positive?colors.green:colors.red,soft=positive?colors.greenSoft:colors.redSoft;
text(c,'最新收盘价',112,410,24,colors.muted,550);text(c,money(last[2]),112,522,92,colors.ink,750);rounded(c,112,555,235,62,8,soft);text(c,`${periodNames[range]} ${pct(change)}`,135,596,25,accent,700);
const metricY=700,metricW=405;rounded(c,112,metricY,metricW,145,8,colors.bg);rounded(c,540,metricY,428,145,8,colors.bg);text(c,'公司代码',145,metricY+48,21,colors.muted);text(c,selected.symbol,145,metricY+102,33,colors.ink,700);text(c,'市值参考',575,metricY+48,21,colors.muted);text(c,cap(selected.market_cap_b),575,metricY+102,33,colors.ink,700);
rounded(c,112,900,856,148,8,colors.green);text(c,'这段时间的价格变化',148,956,23,'#D9E8DD',500);text(c,pct(change),148,1015,49,'#FFFFFF',750);text(c,`${first[0]}  至  ${last[0]}`,932,1010,21,'#E5F0E8',500,'right');text(c,'价格为美元计价',112,1110,20,colors.muted)}
function renderTrend(){if(!selected||!bars.length)return;const last=bars.at(-1),first=bars[0],change=first[2]?(last[2]-first[2])/first[2]*100:0,positive=change>=0,accent=positive?colors.green:colors.red,soft=positive?colors.greenSoft:colors.redSoft;const c=base($('#card-trend'),'区间走势',`${selected.name} · 价格走势`,`${selected.symbol}  /  ${periodNames[range]}  /  日收盘价`);rounded(c,112,365,856,140,8,soft);text(c,'区间涨跌',145,414,22,colors.muted);text(c,pct(change),145,478,49,accent,750);text(c,`${first[0]} — ${last[0]}`,936,467,21,colors.muted,500,'right');
const x0=138,y0=575,w=805,h=420,values=bars.map(b=>Number(b[2])).filter(Number.isFinite),lo=Math.min(...values),hi=Math.max(...values),span=hi-lo||1;for(let i=0;i<4;i++){const y=y0+i*h/3;c.strokeStyle=colors.line;c.lineWidth=2;c.beginPath();c.moveTo(x0,y);c.lineTo(x0+w,y);c.stroke();text(c,money(hi-i*span/3),x0,y-12,18,colors.muted,400)}c.beginPath();values.forEach((v,i)=>{const x=x0+i*w/Math.max(1,values.length-1),y=y0+h-(v-lo)/span*h;i?c.lineTo(x,y):c.moveTo(x,y)});c.lineWidth=7;c.strokeStyle=accent;c.lineJoin='round';c.lineCap='round';c.stroke();const lx=x0+w,ly=y0+h-(values.at(-1)-lo)/span*h;c.fillStyle=accent;c.beginPath();c.arc(lx,ly,10,0,Math.PI*2);c.fill();text(c,first[0],x0,y0+h+43,18,colors.muted);text(c,last[0],x0+w,y0+h+43,18,colors.muted,400,'right');rounded(c,112,1090,856,70,6,colors.bg);text(c,`区间起点  ${money(first[2])}`,142,1135,21,colors.ink,550);text(c,`最新收盘  ${money(last[2])}`,938,1135,21,colors.ink,550,'right')}
function renderMarket(){const c=base($('#card-market'),'市场观察','今日市场涨跌排行',`Top100  ·  ${marketRows.length?'基于可用日涨跌数据':'当前暂时没有排行数据'}`);const rows=marketRows.slice(0,10),bottom=marketRows.slice(-10).reverse(),render=(label,data,y,color)=>{text(c,label,130,y,30,colors.ink,750);text(c,'代码',150,y+54,18,colors.muted,600);text(c,'涨跌幅',920,y+54,18,colors.muted,600,'right');data.forEach((r,i)=>{const yy=y+108+i*45;c.strokeStyle=colors.line;c.lineWidth=1;c.beginPath();c.moveTo(130,yy+12);c.lineTo(950,yy+12);c.stroke();text(c,String(i+1).padStart(2,'0'),150,yy,17,colors.muted);text(c,r.symbol,220,yy,20,colors.ink,700);text(c,pct(r.chg_pct),920,yy,20,color,700,'right')})};if(rows.length){render('涨幅靠前',rows,360,colors.green);render('跌幅靠前',bottom,800,colors.red)}else{wrapText(c,'暂时没有可用的市场涨跌排行数据。请稍后重新加载。',130,470,800,40,3,28,colors.muted)} }
function paint(){renderSummary();renderTrend();renderMarket()}
function download(id){const canvas=document.getElementById(id);if(!canvas||!selected)return;const a=document.createElement('a');a.download=`${selected.symbol}-${id==='card-summary'?'公司行情':id==='card-trend'?'区间走势':'市场排行'}.png`;a.href=canvas.toDataURL('image/png');a.click()}
function renderList(){const q=$('#search').value.trim().toLowerCase(),rows=stocks.filter(x=>`${x.symbol} ${x.name}`.toLowerCase().includes(q)).slice(0,80);results.innerHTML=rows.length?rows.map(x=>`<button class="result ${selected?.symbol===x.symbol?'active':''}" data-symbol="${x.symbol}"><span><strong>${x.symbol}</strong><small>${x.name}</small></span><span class="cap">${cap(x.market_cap_b)}</span></button>`).join(''):'<div class="empty">没有匹配的公司</div>';results.querySelectorAll('.result').forEach(b=>b.onclick=()=>choose(b.dataset.symbol))}
async function choose(symbol){const seq=++serial;selected=stocks.find(x=>x.symbol===symbol);renderList();$('#selected-title').textContent=`${selected.name}（${selected.symbol}） · ${periodNames[range]}`;status.className='status';status.textContent='正在生成分享图片…';try{const [d,r]=await Promise.all([json(`/api/stock/${encodeURIComponent(symbol)}?range=${range}&interval=1d`),json('/api/rank?index=top100')]);if(seq!==serial)return;bars=d.bars||[];if(!bars.length)throw new Error('该公司当前没有可用的历史行情');marketRows=r.filter(x=>Number.isFinite(Number(x.chg_pct))).sort((a,b)=>b.chg_pct-a.chg_pct);await document.fonts.ready;paint();status.textContent=`图片已生成 · 行情截至 ${bars.at(-1)[0]} · 1080 × 1350 px`;$('#download-all').disabled=false}catch(e){if(seq!==serial)return;status.className='status error';status.textContent=`生成失败：${e.message}`;$('#download-all').disabled=true}}
async function init(){try{stocks=await json('/api/stocks?index=top100');renderList();if(stocks.length)choose(stocks[0].symbol);else throw new Error('公司列表为空')}catch(e){results.innerHTML=`<div class="empty">公司列表加载失败：${e.message}</div>`;status.className='status error';status.textContent='无法读取行情接口，请检查服务连接'}}
$('#search').addEventListener('input',renderList);$('#range').addEventListener('change',()=>{range=$('#range').value;if(selected)choose(selected.symbol)});document.querySelectorAll('.download-one').forEach(b=>b.addEventListener('click',()=>download(b.dataset.canvas)));$('#download-all').addEventListener('click',()=>['card-summary','card-trend','card-market'].forEach((id,i)=>setTimeout(()=>download(id),i*450)));init();
})();
</script>
</body>
</html>
